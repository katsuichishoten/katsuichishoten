<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* 基本設定 */
        :root {
            --text-color: #ffffff; /* 文字は真っ白 */
            --accent-color: #bfa071; /* 上品な真鍮色 */
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* ★背景を真っ黒に強制 */
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ヘッダー（最前面に配置） */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100; /* 文字より前に */
            background: rgba(0, 0, 0, 0.6); /* 半透明の黒背景 */
            backdrop-filter: blur(10px); /* ぼかし効果 */
        }

        .logo-text {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-color);
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li { margin-left: 30px; }

        nav ul li a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }

        nav ul li a:hover { color: var(--accent-color); }

        /* =========================================
           背景固定スライドショーの設定
        ========================================= */
        .hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -2; /* ★一番奥に配置 */
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out; /* ふわっと切り替わる時間 */
        }

        .slide.active { opacity: 1; }

        /* スライドショーの上にかける暗いフィルター */
        .hero-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* ★50%の黒で写真を暗くする */
            z-index: -1; /* スライドより前、文字より後ろ */
        }

        /* =========================================
           スクロールコンテンツ（文字）の設定
        ========================================= */
        .content-wrapper {
            position: relative;
            z-index: 1; /* ★スライドショーより前に配置 */
            width: 100%;
        }

        .scroll-section {
            height: 100vh; /* 画面ぴったり */
            display: flex;
            align-items: center;
            padding: 0 10%;
            box-sizing: border-box;
        }

        /* キャッチコピー（縦書き） */
        .copy-text {
            font-family: var(--font-serif);
            font-size: 3.8rem; /* 大きく格好良く */
            letter-spacing: 0.5em; /* 文字間隔を広く */
            writing-mode: vertical-rl; /* 縦書き */
            text-combine-upright: all;
            white-space: nowrap;
            color: #ffffff; /* ★真っ白 */
            /* ★強力な文字の影（背景が明るくても読めるように） */
            text-shadow: 0 0 15px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,1);
            line-height: 1;
        }

        /* 配置のパターン */
        .pos-left { justify-content: flex-start; }
        .pos-right { justify-content: flex-end; }
        .pos-center { justify-content: center; }

        /* フッター */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px;
            background: #000;
            font-size: 0.8rem;
            color: #666;
        }

        /* スマホ対応（レスポンシブ） */
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; }
            .logo-text { font-size: 1.2rem; margin-bottom: 10px; }
            nav ul li { margin-left: 15px; }
            nav ul li a { font-size: 0.8rem; }
            
            .copy-text {
                font-size: 2.2rem; /* スマホでは小さく */
                letter-spacing: 0.3em;
            }
            .scroll-section { padding: 0 5%; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-text">勝一商店株式会社</a>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">会社案内</a></li>
            <li><a href="business.html">事業内容</a></li>
            <li><a href="works.html">施工事例</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </nav>
</header>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1596796335133-149303c27633?q=80&w=2000');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1582238473724-4f8e53488730?q=60&w=800');"></div>
</div>

<div class="content-wrapper">
    
    <section class="scroll-section pos-left">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
            物語の続きを、あなたと描く。
        </div>
    </section>

    <section class="scroll-section pos-right">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
            時をリノベートする。<br>人生をデザインする。
        </div>
    </section>

    <section class="scroll-section pos-center">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
            森を活かし、暮らしを「勝」つ。
        </div>
    </section>

    <footer>
        &copy; 勝一商店株式会社 All Rights Reserved.
    </footer>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    // AOSの初期化（ふわっと表示）
    AOS.init({
        once: false, // スクロールするたびにアニメーションさせる
        duration: 1000,
    });

    // スライドショーの制御（JS）
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    function nextSlide() {
        // 現在の画像を非表示に
        slides[currentIndex].classList.remove('active');
        // インデックスを次へ（最後の次は最初に戻る）
        currentIndex = (currentIndex + 1) % slides.length;
        // 次の画像を表示
        slides[currentIndex].classList.add('active');
    }

    // 5秒ごとに切り替え
    setInterval(nextSlide, 5000);
</script>

</body>
</html>
