<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 50px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 100; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px);
        }

        .logo-text { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 500; letter-spacing: 0.15em; color: #fff; text-decoration: none; }

        nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 0.8rem; letter-spacing: 0.1em; transition: 0.3s; }
        nav ul li a:hover { color: var(--accent-color); }

        /* 背景固定スライドショー */
        .hero-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -2; overflow: hidden;
        }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2.5s ease-in-out;
        }

        .slide.active { opacity: 1; }

        .hero-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); z-index: -1;
        }

        /* コンテンツエリア */
        .content-wrapper { position: relative; z-index: 1; width: 100%; }

        .scroll-section {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 12%; /* 左右の余白を少し広めに */
            box-sizing: border-box;
        }

        /* 配置の切り替え */
        .pos-left { justify-content: flex-start; text-align: left; }
        .pos-right { justify-content: flex-end; text-align: right; }
        .pos-center { justify-content: center; text-align: center; }

        .copy-text {
            font-family: var(--font-serif);
            font-size: 2.2rem; /* ★小さめで繊細なサイズに */
            font-weight: 300; /* ★細めのウェイト */
            letter-spacing: 0.3em;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            line-height: 1.8;
        }

        footer { text-align: center; padding: 40px; background: #000; font-size: 0.75rem; color: #777; letter-spacing: 0.05em; }

        /* スマホ対応 */
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; }
            .logo-text { font-size: 1rem; margin-bottom: 8px; }
            nav ul li { margin-left: 15px; }
            .copy-text { font-size: 1.4rem; letter-spacing: 0.15em; }
            .scroll-section { padding: 0 8%; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-text">勝一商店株式会社</a>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">会社案内</a></li>
            <li><a href="business.html">事業内容</a></li>
            <li><a href="works.html">施工事例</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </nav>
</header>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1596796335133-149303c27633?q=80&w=2000');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1582238473724-4f8e53488730?q=60&w=800');"></div>
</div>

<div class="content-wrapper">
    <section class="scroll-section pos-left">
        <div class="copy-text" data-aos="fade-right" data-aos-duration="1800">
            物語の続きを、あなたと描く。
        </div>
    </section>

    <section class="scroll-section pos-right">
        <div class="copy-text" data-aos="fade-left" data-aos-duration="1800">
            時をリノベートする。<br>人生をデザインする。
        </div>
    </section>

    <section class="scroll-section pos-center">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="1800">
            森を活かし、暮らしを「勝」つ。
        </div>
    </section>

    <footer>
        &copy; 勝一商店株式会社 All Rights Reserved.
    </footer>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        delay: 200,
        once: false,
    });

    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }
    setInterval(nextSlide, 6000); // 落ち着いた印象にするため6秒に延長
</script>

</body>
</html>
