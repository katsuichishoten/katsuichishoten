<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社 | 時をリノベートする</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-text: #ffffff;
            --color-accent: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
            --font-eng: 'Playfair Display', serif;
            --header-height: 90px;
            --header-height-sp: 70px;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
            top: 0 !important; /* Google翻訳バナー対策 */
        }

        /* --- 多言語スイッチのデザイン --- */
        .lang-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 30px;
            font-family: var(--font-eng);
        }
        .lang-btn {
            background: none; border: none; color: #fff;
            cursor: pointer; font-size: 0.75rem; opacity: 0.4;
            padding: 0; transition: 0.3s; letter-spacing: 0.15em;
        }
        .lang-btn:hover, .lang-btn.active { opacity: 1; color: var(--color-accent); }
        .lang-divider { color: rgba(255,255,255,0.2); font-size: 0.7rem; }

        /* Google翻訳の不必要な要素を隠す */
        #google_translate_element, .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0 !important; }

        /* --- ヘッダー --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 60px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 2000; height: var(--header-height);
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }
        .logo-image { height: 45px; width: auto; }

        .nav-pc { display: flex; align-items: center; }
        .nav-pc ul { list-style: none; display: flex; gap: 35px; margin: 0; padding: 0; }
        .nav-pc ul li a { 
            text-decoration: none; color: #fff; font-size: 0.75rem; 
            letter-spacing: 0.15em; transition: 0.5s; opacity: 0.75; 
        }
        .nav-pc ul li a:hover { opacity: 1; color: var(--color-accent); }

        /* --- スマホメニュー --- */
        .menu-trigger {
            display: none; width: 30px; height: 24px; position: relative; z-index: 3000;
            background: none; border: none; cursor: pointer;
        }
        .menu-trigger span { position: absolute; left: 0; width: 100%; height: 1px; background-color: #fff; transition: 0.4s; }
        .menu-trigger span:nth-of-type(1) { top: 0; }
        .menu-trigger span:nth-of-type(2) { top: 11px; }
        .menu-trigger span:nth-of-type(3) { bottom: 0; }
        .menu-trigger.active span:nth-of-type(1) { transform: translateY(11px) rotate(-45deg); }
        .menu-trigger.active span:nth-of-type(2) { opacity: 0; }
        .menu-trigger.active span:nth-of-type(3) { transform: translateY(-12px) rotate(45deg); }

        .nav-sp {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
            background: rgba(10, 10, 10, 0.98); z-index: 2500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.5s; visibility: hidden;
        }
        .nav-sp.active { right: 0; visibility: visible; }
        .nav-sp ul { list-style: none; padding: 0; text-align: center; }
        .nav-sp ul li { margin-bottom: 25px; }
        .nav-sp ul li a { color: #fff; text-decoration: none; font-size: 1.2rem; font-family: var(--font-serif); letter-spacing: 0.2em; }

        /* --- ヒーロー --- */
        .hero-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -2; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transform: scale(1.1); transition: opacity 2.5s ease-in-out, transform 10s ease-out; }
        .slide.active { opacity: 0.5; transform: scale(1.0); }

        .content-wrapper { position: relative; z-index: 10; }
        .section-copy { height: 100vh; display: flex; align-items: center; box-sizing: border-box; }
        .copy-vertical { writing-mode: vertical-rl; font-family: var(--font-serif); font-size: 1.6rem; letter-spacing: 0.5em; color: #fff; line-height: 2; }
        .pos-right { padding-right: 12%; justify-content: flex-end; }

        footer { padding: 40px; text-align: center; font-size: 0.65rem; color: #444; letter-spacing: 0.2em; background: #000; }

        @media (max-width: 768px) {
            header { padding: 0 25px; height: var(--header-height-sp); }
            .nav-pc { display: none; }
            .menu-trigger { display: block; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html">
        <img src="看板_540×450mm_1_out_1-01.png" alt="勝一商店" class="logo-image">
    </a>
    
    <div class="nav-pc">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="business.html">BUSINESS</a></li>
            <li><a href="works.html">WORKS</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
        <div class="lang-switch">
            <button onclick="translatePage('ja')" class="lang-btn">JP</button>
            <span class="lang-divider">/</span>
            <button onclick="translatePage('en')" class="lang-btn">EN</button>
        </div>
    </div>

    <button class="menu-trigger" id="js-hamburger">
        <span></span><span></span><span></span>
    </button>
</header>

<nav class="nav-sp" id="js-nav-sp">
    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="business.html">事業内容</a></li>
        <li><a href="works.html">施工事例</a></li>
        <li><a href="about.html">会社案内</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
        <li style="margin-top: 30px;">
            <div class="lang-switch" style="justify-content: center; margin-left: 0;">
                <button onclick="translatePage('ja')" class="lang-btn">JP</button>
                <span class="lang-divider">/</span>
                <button onclick="translatePage('en')" class="lang-btn">EN</button>
            </div>
        </li>
    </ul>
</nav>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('IMG_5250.JPG');"></div>
</div>

<div class="content-wrapper">
    <section class="section-copy pos-right">
        <div class="copy-vertical" data-aos="fade-down">
            物語の続きを、あなたと描く。<br>
            時をリノベートする。
        </div>
    </section>
    
    <footer>&copy; 勝一商店株式会社</footer>
</div>

<div id="google_translate_element"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1500, once: false });

    // ハンバーガー
    const hamburger = document.getElementById('js-hamburger');
    const navSp = document.getElementById('js-nav-sp');
    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navSp.classList.toggle('active');
    });

    // スライドショー
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    setInterval(() => {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }, 6000);

    // --- Google翻訳制御ロジック ---
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ja',
            includedLanguages: 'ja,en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }

    function translatePage(lang) {
        const select = document.querySelector('select.goog-te-combo');
        if (select) {
            select.value = lang;
            select.dispatchEvent(new Event('change'));
        }
    }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
