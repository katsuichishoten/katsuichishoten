<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 100; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(5px);
        }

        .logo-text { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; letter-spacing: 0.2em; color: #fff; text-decoration: none; }

        nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
        nav ul li { margin-left: 25px; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 0.75rem; letter-spacing: 0.1em; transition: 0.3s; opacity: 0.8; }
        nav ul li a:hover { opacity: 1; color: var(--accent-color); }

        /* 背景固定スライドショー */
        .hero-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -2; overflow: hidden;
        }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.2s ease-in-out; /* 切り替えアニメーションも少し速く */
        }

        .slide.active { opacity: 1; }

        .hero-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: -1;
        }

        /* コンテンツエリア */
        .content-wrapper { position: relative; z-index: 1; width: 100%; }

        .scroll-section {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            box-sizing: border-box;
        }

        .pos-left { justify-content: flex-start; text-align: left; }
        .pos-right { justify-content: flex-end; text-align: right; }
        .pos-center { justify-content: center; text-align: center; }

        .copy-text {
            font-family: var(--font-serif);
            font-size: 1.4rem; /* ★PCサイズを大幅に縮小 */
            font-weight: 200; /* ★さらに細いウェイトを使用 */
            letter-spacing: 0.4em;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            line-height: 2;
            white-space: nowrap; /* ★改行を禁止して1行を維持 */
        }

        footer { text-align: center; padding: 30px; background: #000; font-size: 0.7rem; color: #555; letter-spacing: 0.1em; }

        /* スマホ対応 */
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; }
            .logo-text { font-size: 0.9rem; margin-bottom: 5px; }
            nav ul li { margin-left: 12px; }
            .copy-text { 
                font-size: 0.85rem; /* ★スマホで1行に収まる極小サイズ */
                letter-spacing: 0.2em; 
            }
            .scroll-section { padding: 0 5%; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-text">勝一商店株式会社</a>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="business.html">BUSINESS</a></li>
            <li><a href="works.html">WORKS</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>
</header>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('IMG_0538.HEIC');"></div>
    <div class="slide" style="background-image: url('IMG_5250.JPG');"></div>
    <div class="slide" style="background-image: url('IMG_7222.jpg');"></div>
</div>

<div class="content-wrapper">
    <section class="scroll-section pos-left">
        <div class="copy-text" data-aos="fade-right" data-aos-duration="1500">
            物語の続きを、あなたと描く。
        </div>
    </section>

    <section class="scroll-section pos-right">
        <div class="copy-text" data-aos="fade-left" data-aos-duration="1500">
            時をリノベートする。人生をデザインする。
        </div>
    </section>

    <section class="scroll-section pos-center">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="1500">
            森を活かし、暮らしを「勝」つ。
        </div>
    </section>

    <footer>
        &copy; 勝一商店株式会社
    </footer>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ once: false });

    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }
    // ★切り替えを3秒（3000ms）に設定
    setInterval(nextSlide, 3000);
</script>

</body>
</html>
