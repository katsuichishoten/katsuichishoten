<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif; line-height: 1.8;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 1000; background: rgba(18, 18, 18, 0.5); backdrop-filter: blur(10px);
        }

        .header-logo-wrap { display: flex; align-items: center; }
        .logo-text { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; letter-spacing: 0.1em; }

        nav ul { list-style: none; display: flex; margin: 0; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: var(--text-color); font-size: 0.85rem; letter-spacing: 0.1em; }

        /* スライドショー背景（固定） */
        .hero-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -1; /* 背面に固定 */
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2s ease-in-out;
        }

        .slide.active { opacity: 1; }

        /* 全体にかける暗いフィルター */
        .hero-container::after {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
        }

        /* スクロールコンテンツ */
        .scroll-section {
            height: 100vh; /* 1画面分 */
            display: flex; align-items: center;
            position: relative;
            padding: 0 10%;
        }

        /* キャッチコピー（縦書き） */
        .copy-text {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            letter-spacing: 0.5em;
            writing-mode: vertical-rl;
            text-combine-upright: all;
            white-space: nowrap;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
        }

        /* 表示位置をバラバラにする設定 */
        .pos-left { justify-content: flex-start; }
        .pos-center { justify-content: center; }
        .pos-right { justify-content: flex-end; }

        footer {
            text-align: center; padding: 50px; background: #121212;
            font-size: 0.7rem; color: #888;
        }

        @media (max-width: 768px) {
            .copy-text { font-size: 2rem; }
            header { padding: 15px 20px; }
            nav ul li { margin-left: 15px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-logo-wrap">
        <div class="logo-text">勝一商店株式会社</div>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">会社案内</a></li>
            <li><a href="business.html">事業内容</a></li>
            <li><a href="works.html">施工事例</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </nav>
</header>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1596796335133-149303c27633?q=80&w=2000');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1582238473724-4f8e53488730?q=60&w=800');"></div>
</div>

<section class="scroll-section pos-left">
    <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
        物語の続きを、あなたと描く。
    </div>
</section>

<section class="scroll-section pos-right">
    <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
        時をリノベートする。<br>人生をデザインする。
    </div>
</section>

<section class="scroll-section pos-center">
    <div class="copy-text" data-aos="fade-up" data-aos-duration="2000">
        森を活かし、暮らしを「勝」つ。
    </div>
</section>

<footer>
    &copy; 勝一商店株式会社
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    // 初期化
    AOS.init();

    // スライドショーの制御
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }

    setInterval(nextSlide, 5000); // 5秒ごとに背景切り替え
</script>

</body>
</html>
</body>
</html>
