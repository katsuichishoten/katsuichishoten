<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 50px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 100; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
        }

        .logo-text { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; color: #fff; text-decoration: none; }

        nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 0.85rem; letter-spacing: 0.1em; transition: 0.3s; }
        nav ul li a:hover { color: var(--accent-color); }

        /* 背景固定スライドショー */
        .hero-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -2; overflow: hidden;
        }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2s ease-in-out;
        }

        .slide.active { opacity: 1; }

        .hero-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: -1;
        }

        /* 横書きコンテンツ */
        .content-wrapper { position: relative; z-index: 1; width: 100%; }

        .scroll-section {
            height: 100vh;
            display: flex;
            align-items: center; /* 上下中央 */
            justify-content: center; /* 左右中央 */
            padding: 0 10%;
            box-sizing: border-box;
        }

        .copy-text {
            font-family: var(--font-serif);
            font-size: 3.5rem; /* ★横書きなので大きく */
            letter-spacing: 0.2em; /* 文字間を程よくあける */
            text-align: center;
            color: #ffffff;
            /* 影は「柔らかく」して視認性を確保 */
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            line-height: 1.6;
        }

        footer { text-align: center; padding: 40px; background: #000; font-size: 0.8rem; color: #666; }

        /* スマホ対応 */
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; }
            .logo-text { font-size: 1.1rem; margin-bottom: 10px; }
            nav ul li { margin-left: 15px; }
            .copy-text { font-size: 1.8rem; letter-spacing: 0.1em; line-height: 1.4; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-text">勝一商店株式会社</a>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">会社案内</a></li>
            <li><a href="business.html">事業内容</a></li>
            <li><a href="works.html">施工事例</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </nav>
</header>

<div class="hero-container">
    <div class="slide active" style="background-image: url('DSCF0613.JPEG');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1596796335133-149303c27633?q=80&w=2000');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1582238473724-4f8e53488730?q=60&w=800');"></div>
</div>

<div class="content-wrapper">
    <section class="scroll-section">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="1500">
            物語の続きを、あなたと描く。
        </div>
    </section>

    <section class="scroll-section">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="1500">
            時をリノベートする。<br>人生をデザインする。
        </div>
    </section>

    <section class="scroll-section">
        <div class="copy-text" data-aos="fade-up" data-aos-duration="1500">
            森を活かし、暮らしを「勝」つ。
        </div>
    </section>

    <footer>
        &copy; 勝一商店株式会社 All Rights Reserved.
    </footer>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();

    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }
    setInterval(nextSlide, 5000);
</script>

</body>
</html>
