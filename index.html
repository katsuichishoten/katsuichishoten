<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝一商店株式会社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400;500&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #bfa071;
            --font-serif: 'Noto Serif JP', serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; position: fixed; top: 0; width: 100%; box-sizing: border-box;
            z-index: 100; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(5px);
        }

        .logo-text { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; letter-spacing: 0.2em; color: #fff; text-decoration: none; }

        nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
        nav ul li { margin-left: 25px; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 0.75rem; letter-spacing: 0.1em; transition: 0.3s; opacity: 0.8; }
        nav ul li a:hover { opacity: 1; color: var(--accent-color); }

        .hero-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -2; overflow: hidden;
        }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.2s ease-in-out;
        }

        .slide.active { opacity: 1; }

        .hero-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: -1;
        }

        .content-wrapper { position: relative; z-index: 1; width: 100%; }

        .scroll-section {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            box-sizing: border-box;
        }

        .pos-left { justify-content: flex-start; text-align: left; }
        .pos-right { justify-content: flex-end; text-align: right; }
        .pos-center { justify-content: center; text-align: center; }

        .copy-text {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            line-height: 2;
            white-space: nowrap;
        }

        /* はじめての方へ（メッセージ）セクション */
        .intro-section {
            background-color: #000;
            padding: 150px 0;
            position: relative;
            z-index: 5;
        }

        .intro-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            gap: 80px;
            padding: 0 50px;
        }

        .intro-text { flex: 1.4; }
        .intro-text h2 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 50px;
            font-weight: 400;
            letter-spacing: 0.25em;
        }

        .intro-text p {
            font-size: 0.9rem;
            line-height: 2.4;
            margin-bottom: 2rem;
            font-weight: 300;
            color: #ddd;
            letter-spacing: 0.08em;
        }

        .intro-text .highlight {
            color: #fff;
            font-weight: 400;
        }
